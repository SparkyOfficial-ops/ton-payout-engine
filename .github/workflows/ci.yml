name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CTON_SDK_REPO: https://github.com/SparkyOfficial-ops/cton-sdk.git
  CTON_SDK_REF: main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install cton-sdk
        run: |
          git clone --depth 1 --branch "$CTON_SDK_REF" "$CTON_SDK_REPO" ../cton-sdk-main
          mvn -B -f ../cton-sdk-main/pom.xml install -DskipTests
      - name: Test
        run: ./gradlew test
  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            CTON_SDK_REPO=${{ env.CTON_SDK_REPO }}
            CTON_SDK_REF=${{ env.CTON_SDK_REF }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
