name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

env:
  CTON_SDK_REPO: https://github.com/SparkyOfficial-ops/cton-sdk.git
  CTON_SDK_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install cton-sdk
        run: |
          git clone --depth 1 --branch "$CTON_SDK_REF" "$CTON_SDK_REPO" ../cton-sdk-main
          mvn -B -f ../cton-sdk-main/pom.xml install -DskipTests

      - name: Set version
        id: ver
        run: |
          RAW="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${RAW#v}" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: ./gradlew test shadowJar -PprojectVersion=${{ steps.ver.outputs.version }}

      - name: Rename JAR
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mv build/libs/ton-payout-engine-${VERSION}.jar \
             build/libs/ton-payout-engine-${VERSION}-fat.jar

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: build/libs/ton-payout-engine-${{ steps.ver.outputs.version }}-fat.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "TonPayoutEngine ${{ github.event.inputs.tag || github.ref_name }}"
          body_path: CHANGELOG.md
          fail_on_unmatched_files: false
          make_latest: true
          files: |
            dist/ton-payout-engine-${{ needs.build.outputs.version }}-fat.jar

      - uses: docker/setup-buildx-action@v3

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CTON_SDK_REPO=${{ env.CTON_SDK_REPO }}
            CTON_SDK_REF=${{ env.CTON_SDK_REF }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.event.inputs.tag || github.ref_name }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: docs/dist/

      - name: Inject version into site
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          sed -i "s/__VERSION__/${VERSION}/g" docs/index.html
          sed -i "s/__VERSION__/${VERSION}/g" docs/quickstart.html
          sed -i "s/__VERSION__/${VERSION}/g" docs/api.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          destination_dir: .
          keep_files: false
          commit_message: "docs: release ${{ github.ref_name }}"
