name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CTON_SDK_REPO: https://github.com/SparkyOfficial-ops/cton-sdk.git
  CTON_SDK_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install cton-sdk
        run: |
          git clone --depth 1 --branch "$CTON_SDK_REF" "$CTON_SDK_REPO" ../cton-sdk-main
          mvn -B -f ../cton-sdk-main/pom.xml install -DskipTests

      - name: Set version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set Maven version
        run: mvn -B versions:set -DnewVersion="${{ steps.ver.outputs.version }}" -DgenerateBackupPoms=false

      - name: Build & test
        run: mvn -B clean package

      - name: Rename JAR
        run: |
          # maven-shade produces the fat JAR without the "original-" prefix
          JAR="target/ton-payout-engine-${{ steps.ver.outputs.version }}.jar"
          FAT="target/ton-payout-engine-${{ steps.ver.outputs.version }}-fat.jar"
          if [ -f "$JAR" ]; then
            mv "$JAR" "$FAT"
          else
            # shade plugin may keep original name — find it
            FOUND=$(find target -maxdepth 1 -name "ton-payout-engine-*.jar" \
                      ! -name "original-*" | head -1)
            mv "$FOUND" "$FAT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/ton-payout-engine-${{ steps.ver.outputs.version }}-fat.jar

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: dist/

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TonPayoutEngine ${{ github.ref_name }}"
          body_path: CHANGELOG.md
          # If the release was created manually (like v1.0.0), just append the JAR
          fail_on_unmatched_files: false
          make_latest: true
          files: |
            dist/ton-payout-engine-${{ needs.build.outputs.version }}-fat.jar

      - uses: docker/setup-buildx-action@v3

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CTON_SDK_REPO=${{ env.CTON_SDK_REPO }}
            CTON_SDK_REF=${{ env.CTON_SDK_REF }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.ref_name }}
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: jar
          path: docs/dist/

      - name: Inject version into site
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          sed -i "s/__VERSION__/${VERSION}/g" docs/index.html
          sed -i "s/__VERSION__/${VERSION}/g" docs/quickstart.html
          sed -i "s/__VERSION__/${VERSION}/g" docs/api.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs
          destination_dir: .
          keep_files: false
          commit_message: "docs: release ${{ github.ref_name }}"
