# Local defaults. Environment variables with the same meaning override these.
# See .env.example. The wallet private key is never read in this skeleton.

http.host=0.0.0.0
http.port=8080

# Empty key rejects every API call except GET /health.
auth.apiKey=

wallet.address=
wallet.keyPath=secrets/wallet.key
wallet.subwalletId=698983191

ton.endpoint=https://toncenter.com/api/v2
ton.apiKey=
ton.network=mainnet

# Buffer single payouts, then glue them into one highload message.
batch.windowMs=2500
batch.maxSize=254

webhook.url=
webhook.timeoutMs=5000

# Queue and batch status. Committed before POST returns.
db.path=data/payout.db

# sent means the message is in the mempool. confirmed means it is in a block.
confirm.delayMs=12000
confirm.attempts=4

# Checked before broadcast. 50000000 nano = 0.05 TON for the highload message.
wallet.feeReserveNano=50000000
pause.retryMs=15000
alert.url=

# Crash window: sending with no progress for this long is checked on chain, then confirmed or failed.
sending.staleMs=300000
